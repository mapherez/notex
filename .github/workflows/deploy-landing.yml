name: Publish NoteX Landing Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - "package.json"
      - "package-lock.json"
      - "docker/landing/**"
      - "scripts/check-landing-image.mjs"
      - ".github/workflows/deploy-landing.yml"

permissions:
  contents: read

concurrency:
  group: notex-landing-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish landing image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set image name
        id: config
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/notex-landing" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for server checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/landing/Dockerfile
          load: true
          platforms: linux/amd64
          tags: notex-landing:check
          cache-from: type=gha,scope=notex-landing
          cache-to: type=gha,mode=max,scope=notex-landing

      - name: Check Nginx, landing, docs and deployment isolation
        run: node scripts/check-landing-image.mjs notex-landing:check

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/landing/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.config.outputs.image }}:latest
            ${{ steps.config.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=notex-landing
          cache-to: type=gha,mode=max,scope=notex-landing

      - name: Deployment summary
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `%s:latest`\n\nCommit tag: `sha-%s`\n\nDigest: `%s`\n\nCopy `docker-compose.landing.yml` to the host as `docker-compose.yml`, then run `docker compose pull` and `docker compose up -d`. Default port: 8094.\n\nLanding/docs only; keep the existing webapp and Cloudflare worker routing.\n' "$IMAGE" "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
