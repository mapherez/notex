name: NoX MCP base
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/nox-mcp/**', '.github/workflows/nox-mcp.yml']
  push:
    paths: ['packages/nox-mcp/**', '.github/workflows/nox-mcp.yml']
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix packages/nox-mcp/typescript
      - run: npm run build --prefix packages/nox-mcp/typescript
      - run: node packages/nox-mcp/scripts/generate.mjs --check
      - run: npm test --prefix packages/nox-mcp/typescript
      - run: node packages/nox-mcp/scripts/export.mjs output/nox-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: nox-mcp-source
          path: output/nox-mcp
          include-hidden-files: true
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: packages/nox-mcp/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - run: go test -race ./... && go vet ./...
        working-directory: packages/nox-mcp/go
      - run: cargo fmt --check && cargo test --locked && cargo package --locked --allow-dirty
        working-directory: packages/nox-mcp/rust
