name: Publish MCP Backend Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        default: latest

permissions:
  contents: read

jobs:
  approval:
    name: Reuse approved source CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.ci.outputs.source_sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Require successful CI for the exact source
        id: ci
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireApprovedCI } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-policy.mjs`).href);
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice('refs/tags/'.length) : '';

            const approval = await requireApprovedCI({ github, ...context.repo, revision: context.sha, tag });
            core.setOutput('source_sha', approval.sourceSha);
            core.setOutput('ci_run_id', String(approval.runId));
            core.notice(`Reusing source CI ${approval.runId} (${approval.sourceSha}); no source checks are repeated.`);

  publish:
    needs: approval
    name: Publish backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mapherez/notex-mcp:${{ inputs.tag }}
