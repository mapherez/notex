name: MCP Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "packages/notex-mcp-contract/**"
      - ".dockerignore"
      - "docker-compose.mcp.yml"
      - ".github/workflows/mcp-backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "packages/notex-mcp-contract/**"
      - ".dockerignore"
      - "docker-compose.mcp.yml"
      - ".github/workflows/mcp-backend.yml"

permissions:
  contents: read

concurrency:
  group: mcp-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Shared contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/notex-mcp-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/notex-mcp-contract/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            packages/notex-mcp-contract/package-lock.json
      - name: Install contract dependencies
        working-directory: packages/notex-mcp-contract
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Test
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - contract
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -f backend/Dockerfile -t notex-mcp:test .
