name: MCP Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "packages/notex-mcp-contract/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "docker-compose.mcp.yml"
      - ".github/workflows/mcp-backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "packages/notex-mcp-contract/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "docker-compose.mcp.yml"
      - ".github/workflows/mcp-backend.yml"

permissions:
  contents: read

concurrency:
  group: mcp-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Shared contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @notex/mcp-contract
      - name: Test
        run: npm test --workspace @notex/mcp-contract
      - name: Build
        run: npm run build --workspace @notex/mcp-contract

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace backend
      - name: Test
        run: npm test --workspace backend
      - name: Build
        run: npm run build --workspace backend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - contract
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -f backend/Dockerfile -t notex-mcp:test .
