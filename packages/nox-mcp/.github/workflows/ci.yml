name: NoX MCP conformity
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix typescript
      - run: npm run build --prefix typescript
      - run: node scripts/generate.mjs --check
      - run: npm test --prefix typescript
      - run: npm pack --pack-destination ..
        working-directory: typescript
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./examples/echo
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo package --locked
