<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1017" />
    <link rel="icon" type="image/vnd.microsoft.icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/notex-mark.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="%BASE_URL%assets/fonts/fonts.css" />
    <link rel="preload" href="%BASE_URL%assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>NoteX</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #0d1017;
      }

      .app-boot-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1017;
        color: #eff1f7;
        font-family:
          "DM Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .app-boot-loader__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .app-boot-loader__spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(241, 242, 244, 0.16);
        border-top-color: #acb6ed;
        border-radius: 999px;
        animation: app-boot-spin 0.8s linear infinite;
      }

      .app-boot-loader__label {
        font-size: 35px;
        font-weight: 700;
      }

      .app-boot-loader__accent {
        color: #b6a7f4;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loader__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" aria-label="Loading NoteX" role="status">
        <div class="app-boot-loader__content">
          <img
            src="%BASE_URL%assets/notex-icon.svg"
            width="200"
            height="200"
            alt="NoteX Logo"
          />
          <span class="app-boot-loader__label">Note<span class="app-boot-loader__accent">X</span></span>
          <span class="app-boot-loader__spinner" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
