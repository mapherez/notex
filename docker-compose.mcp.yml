services:
  notex-mcp:
    image: ghcr.io/mapherez/notex-mcp:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: notex-mcp
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      NOTEX_MCP_PUBLIC_URL: "${NOTEX_MCP_PUBLIC_URL:?Set NOTEX_MCP_PUBLIC_URL}"
      NOTEX_MCP_HOST: "0.0.0.0"
      NOTEX_MCP_PORT: "8080"
      NOTEX_MCP_DATABASE_PATH: "/data/notex-mcp.sqlite"
      NOTEX_MCP_ALLOWED_HOSTS: "${NOTEX_MCP_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      NOTEX_MCP_TRUST_PROXY: "${NOTEX_MCP_TRUST_PROXY:-}"
      NOTEX_MCP_LOG_LEVEL: "${NOTEX_MCP_LOG_LEVEL:-info}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}"
    volumes:
      - notex-mcp-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  notex-mcp-data:
