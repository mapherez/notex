services:
  notex-web:
    image: ghcr.io/mapherez/notex-web:${NOTEX_WEB_TAG:-latest}
    container_name: notex-web
    restart: unless-stopped
    ports:
      - "${NOTEX_WEB_PORT:-8093}:8080"

# No env file or volume required. OAuth web configuration is compiled into
# the image; libraries live in each user's browser and personal Google Drive.
# This image serves only /app/. Landing/docs keep their independent deployment.
# A public path router must forward /app/ to HOST_IP:8093, preserving the path.
# Do not point the entire notex.mapherez.com domain at this container.
