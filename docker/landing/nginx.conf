server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # HTML and stable compatibility URLs must revalidate after each deployment.
    add_header Cache-Control "no-cache" always;

    # Test the original client request, so serving a directory's index.html
    # internally cannot redirect back to the same directory in a loop.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 308 /$is_args$args;
    }
    if ($request_uri ~ "^/docs/index\.html(?:\?|$)") {
        return 308 /docs/$is_args$args;
    }
    if ($request_uri ~ "^/(?<legacy_page>privacy|terms|docs/[a-z0-9-]+)\.html(?:\?|$)") {
        return 308 /$legacy_page$is_args$args;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The webapp has its own image and public routing.
    location = /app {
        return 404;
    }

    location ^~ /app/ {
        return 404;
    }

    location = /docs {
        return 308 /docs/$is_args$args;
    }

    # The build changes these URLs whenever their contents change. Missing
    # assets must return 404 rather than HTML or a year-long cached error.
    location ~ "\.[a-f0-9]{12}\.(css|js|json|woff2?|png|jpe?g|webp|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve actual pages and directory indexes, without an SPA fallback.
    # /download continues to be handled by the existing Cloudflare worker.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
