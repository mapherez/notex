server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Filenames are not content-hashed; revalidate styles and content on updates.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The webapp has its own image and public routing.
    location = /app {
        return 404;
    }

    location ^~ /app/ {
        return 404;
    }

    # Serve actual pages and directory indexes, without an SPA fallback.
    # /download continues to be handled by the existing Cloudflare worker.
    location / {
        try_files $uri $uri/ =404;
    }
}
