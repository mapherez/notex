server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Keep redirects relative behind an HTTPS reverse proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /app {
        return 308 /app/;
    }

    location = /app/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /app/sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's content-hashed assets can be cached indefinitely.
    location ~* "^/app/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|png|jpe?g|webp|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Missing files must not return the SPA HTML (especially scripts/workers).
    location ~* ^/app/.*\.(js|css|json|ico|png|jpe?g|webp|svg|woff2?|map|html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # This container serves only the app. Landing/docs have their own deployment.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
